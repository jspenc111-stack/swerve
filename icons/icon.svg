<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Swerve app icon: an arrow swerving between cubes (original artwork) -->
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="104"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb4e0"/>
      <stop offset="1" stop-color="#eef5fa"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe3e6"/>
      <stop offset="1" stop-color="#f4f4ef"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="230" fill="url(#sky)"/>
    <rect y="230" width="512" height="282" fill="url(#ground)"/>
    <g stroke="#d5d8d6" stroke-width="3" fill="none">
      <path d="M256 230 L40 512 M256 230 L472 512 M256 230 L-120 512 M256 230 L632 512"/>
      <path d="M0 262 H512 M0 310 H512 M0 390 H512"/>
    </g>
    <!-- far cube -->
    <rect x="300" y="226" width="30" height="28" fill="#8d939b"/>
    <polygon points="300,226 330,226 326,221 302,221" fill="#b7bcc2"/>
    <polygon points="300,226 302,221 302,249 300,254" fill="#6c7279"/>
    <!-- left cube -->
    <rect x="64" y="268" width="104" height="96" fill="#7a49b4"/>
    <polygon points="64,268 168,268 184,248 86,248" fill="#a37fd2"/>
    <polygon points="168,268 184,248 184,342 168,364" fill="#57308c"/>
    <!-- right cube -->
    <rect x="346" y="282" width="112" height="104" fill="#ea6457"/>
    <polygon points="346,282 458,282 438,260 330,260" fill="#f4968a"/>
    <polygon points="346,282 330,260 330,362 346,386" fill="#b5473c"/>
    <!-- ship shadow and arrow -->
    <ellipse cx="262" cy="452" rx="74" ry="15" fill="#000" opacity="0.16"/>
    <g transform="rotate(-9 256 400)">
      <polygon points="256,300 330,440 256,404 182,440" fill="#d9483b"/>
      <polygon points="256,300 256,404 182,440" fill="#f2655a"/>
    </g>
  </g>
</svg>
